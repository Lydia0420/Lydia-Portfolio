<script>
const cards = [...document.querySelectorAll('.card')];
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

const skipIntro =
  new URLSearchParams(window.location.search).get('state') === 'fan';

const EASE_SPREAD = 'cubic-bezier(.22,.72,.24,1)';
const EASE_STACK  = 'cubic-bezier(.62,0,.28,1)';
const EASE_FAN    = 'cubic-bezier(.18,.78,.2,1)';

function unit() {
  const w = Math.min(window.innerWidth, 1200);
  return Math.max(.62, Math.min(1, w / 1120));
}

function transformOf({x=0,y=0,r=0,rx=0,ry=0}) {
  return `
    translate(calc(-50% + ${x}px), calc(-50% + ${y}px))
    perspective(1000px)
    rotateX(${rx}deg)
    rotateY(${ry}deg)
    rotateZ(${r}deg)
  `;
}

function setPose(el, p) {
  el.style.zIndex = p.z ?? 1;
  el.style.transform = transformOf(p);
}

function animatePose(el, from, to, duration, easing, delay=0) {
  el.style.zIndex = to.z ?? from.z ?? 1;
  return el.animate([
    { transform: transformOf(from) },
    { transform: transformOf(to) }
  ], {
    duration,
    delay,
    easing,
    fill: 'forwards'
  }).finished.catch(() => {});
}

/*
  PHASE 1
  整体从右向左“带出来”。第一张始终在最上层。
  所有图片保持正视角，只改变 X。

  运动不是“逐张抽出然后停住”，而是一条连续的队列：
  - 第一张先向左滑；
  - 后面的图保持相同方向、紧跟着从它身后出现；
  - 队列形成后，后面的图继续追上第一张；
  - 最终 6 张完全重叠，只看到第一张。
*/
function trainStartPoses() {
  const k = unit();
  const start = 330 * k;
  const gap = 78 * k;
  return cards.map((_, i) => ({
    x: start + i * gap,
    y: 0,
    r: 0,
    z: i === 0 ? 100 : 50 - i
  }));
}

function exactStackPoses() {
  return cards.map((_, i) => ({
    x: 0,
    y: 0,
    r: 0,
    z: i === 0 ? 100 : 50 - i
  }));
}

function animateTrainCard(el, i, duration = 1900) {
  const k = unit();
  const start = 330 * k;
  const gap = 78 * k;

  // 第一张先走；越靠后的卡片，开始向左移动的时间稍晚。
  // 中段形成均匀队列，后段再连续压缩到第一张背后。
  const followDelay = i * 0.055;
  const revealEnd = 0.58;
  const catchStart = 0.62;

  const x0 = start + i * gap;
  const xTrain = i * gap;

  const frames = [
    { offset: 0, transform: transformOf({x:x0,y:0,r:0}) },
  ];

  if (i > 0) {
    frames.push({
      offset: followDelay,
      transform: transformOf({x:x0,y:0,r:0})
    });
  }

  frames.push(
    {
      offset: revealEnd,
      transform: transformOf({x:xTrain,y:0,r:0})
    },
    {
      offset: catchStart,
      transform: transformOf({x:xTrain,y:0,r:0})
    },
    {
      offset: 1,
      transform: transformOf({x:0,y:0,r:0})
    }
  );

  el.style.zIndex = i === 0 ? 100 : 50 - i;

  return el.animate(frames, {
    duration,
    easing: 'cubic-bezier(.42,0,.18,1)',
    fill: 'forwards'
  }).finished.catch(() => {});
}

/*
  PHASE 2
  六张图从完全正视、完全重叠的状态同时展开。
  位移沿同一条斜线：左上 <-> 右下。
  每张图施加完全相同的轻微旋转角度，从而形成统一的 3D 卡片感。
*/
function finalFanPoses() {
  const ROTATE = -5;
  const ROTATE_X = 8;
  const ROTATE_Y = 4;

  // 卡片实际尺寸
  const card = document.querySelector('.card');
  const size = card.getBoundingClientRect().width;

  // 屏幕中心到边缘的距离
  const halfW = window.innerWidth / 2;
  const halfH = window.innerHeight / 2;

  // 因为我们希望卡片“外角”碰到屏幕角落，
  // 所以卡片中心不能直接到 halfW / halfH，
  // 要减去半张卡片的尺寸。
  const maxX = (halfW - size / 2) * 0.95
  const maxY = (halfH - size / 2) * 1.07;

  return [
  { x:  maxX,        y:  maxY,        r: ROTATE, rx: ROTATE_X, ry: ROTATE_Y, z: 100 },
  { x:  maxX*0.666,  y:  maxY*0.666,  r: ROTATE, rx: ROTATE_X, ry: ROTATE_Y, z: 60 },
  { x:  maxX*0.333,  y:  maxY*0.333,  r: ROTATE, rx: ROTATE_X, ry: ROTATE_Y, z: 50 },
  { x:  0,           y:  0,           r: ROTATE, rx: ROTATE_X, ry: ROTATE_Y, z: 40 },
  { x: -maxX*0.333,  y: -maxY*0.333,  r: ROTATE, rx: ROTATE_X, ry: ROTATE_Y, z: 30 },
  { x: -maxX*0.666,  y: -maxY*0.666,  r: ROTATE, rx: ROTATE_X, ry: ROTATE_Y, z: 20 },
  { x: -maxX,        y: -maxY,        r: ROTATE, rx: ROTATE_X, ry: ROTATE_Y, z: 10 }
];
}

function setupHover(fan) {
  const HOVER_Y = 30;
  const HOVER_DURATION = 240;
  const HOVER_EASE = 'cubic-bezier(.22,.72,.24,1)';

  cards.forEach((card, i) => {
    const base = fan[i];

    const hoverPose = {
      ...base,
      y: base.y - HOVER_Y
    };

    card.addEventListener('mouseenter', () => {
      card.animate([
        { transform: transformOf(base) },
        { transform: transformOf(hoverPose) }
      ], {
        duration: HOVER_DURATION,
        easing: HOVER_EASE,
        fill: 'forwards'
      });
    });

    card.addEventListener('mouseleave', () => {
      card.animate([
        { transform: transformOf(hoverPose) },
        { transform: transformOf(base) }
      ], {
        duration: HOVER_DURATION,
        easing: HOVER_EASE,
        fill: 'forwards'
      });
    });
  });
}

async function run() {
  const start = trainStartPoses();
  const stack = exactStackPoses();
  const fan   = finalFanPoses();

  // 从作品内页返回：直接显示最终展开状态
  if (skipIntro) {
    cards.forEach((card, i) => setPose(card, fan[i]));
    setupHover(fan);
    return;
  }

  // 正常进入 Sketchbook：播放完整动画
  cards.forEach((card, i) => setPose(card, start[i]));
  await sleep(180);

  await Promise.all(cards.map((card, i) =>
    animateTrainCard(card, i)
  ));

  cards.forEach((card, i) => setPose(card, stack[i]));
  await sleep(260);

  await Promise.all(cards.map((card, i) =>
    animatePose(card, stack[i], fan[i], 980, EASE_FAN, 0)
  ));

  setupHover(fan);
}

run();
</script>
