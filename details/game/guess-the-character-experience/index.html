<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guess the Character</title><style>html,body{margin:0;padding:0}canvas{display:block}nav.game-nav{position:fixed;top:20px;left:28px;right:28px;z-index:10000;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font:14px Arial,sans-serif}nav.game-nav a,nav.game-nav button{pointer-events:auto;color:#60441e;text-decoration:none;background:transparent;border:0;padding:4px 0;font:inherit;cursor:pointer}nav.game-nav a:hover,nav.game-nav button:hover{color:#8e2949}nav.game-nav a:focus-visible,nav.game-nav button:focus-visible{outline:2px solid #8e2949;outline-offset:5px}@media(max-width:500px){nav.game-nav{top:14px;left:18px;right:18px}}html,body{background:#e9b96e}
